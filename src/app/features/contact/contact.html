<section class="relative flex flex-col overflow-hidden bg-primary">
  <img
    src="/images/contactUs/contact-us.webp"
    alt=""
    width="1600"
    height="900"
    class="pointer-events-none absolute inset-0 size-full object-cover"
    aria-hidden="true"
  />
  <div
    class="pointer-events-none absolute inset-0 bg-linear-to-t from-primary via-primary/80 to-primary/55"
    aria-hidden="true"
  ></div>
  <div class="site-container relative mt-6 flex w-full items-center justify-around px-4 pb-16 md:mt-12 md:px-0 md:pb-20">
    <div class="w-3/4 md:w-1/2">
      <p class="font-body text-xl font-bold tracking-wide text-secondary">مختبر الشركات</p>
      <h1
        class="mt-4 max-w-4xl border-s-4 border-secondary ps-5 font-heading text-2xl font-extrabold leading-tight text-inverse md:text-7xl"
      >
        تواصل معنا
      </h1>
      <button
        type="button"
        (click)="showForm('message')"
        class="mt-10 inline-flex min-h-11 cursor-pointer items-center rounded-md bg-secondary px-5 text-base font-bold text-primary hover:bg-secondary-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      >
        ارسل رسالتك
      </button>
    </div>
    <div class="mt-10 flex w-1/4 flex-col items-end justify-center md:w-1/2">
      <img src="/images/logo/waei_logo_black.PNG" class="w-[110px] invert md:w-[180px]" alt="" />
      <img src="/images/logo/waei_title_black.PNG" class="w-[110px] invert md:w-[180px]" alt="" />
    </div>
  </div>
</section>

<section class="relative border-t border-border bg-surface" aria-labelledby="contact-choice-heading">
  <div class="site-container px-3 py-16 md:px-0 md:py-20">
    <div class="lg:mx-auto lg:max-w-4xl">
      <h2
        id="contact-choice-heading"
        class="flex items-center gap-4 font-heading text-3xl font-extrabold text-primary"
      >
        <span class="size-2.5 shrink-0 rotate-45 bg-secondary" aria-hidden="true"></span>
        كيف يمكننا مساعدتك؟
      </h2>
      <p class="font-body mt-3 text-lg leading-8 text-muted md:text-xl">
        اختر الطريقة الأنسب للتواصل مع فريق واعي.
      </p>

      <div class="mt-8 grid gap-4 md:grid-cols-2">
        <button
          type="button"
          (click)="showForm('diagnosis')"
          [attr.aria-pressed]="intent() === 'diagnosis'"
          class="flex min-h-44 cursor-pointer flex-col items-start rounded-2xl border-2 border-secondary/40 bg-primary p-6 text-start text-inverse
                 shadow-sm transition hover:-translate-y-0.5 hover:border-secondary hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary
                  motion-reduce:transition-none motion-reduce:hover:translate-y-0 md:p-8 focus:shadow-secondary-light focus:shadow-lg"
          [class.border-secondary]="intent() === 'diagnosis'"
          [class.shadow-md]="intent() === 'diagnosis'"
        >
          <span class="font-body inline-flex items-center gap-3 text-lg font-bold text-secondary">
            <svg class="size-10 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M6 18h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M3 22h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M14 22a7 7 0 1 0 0-14h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9 14h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            مجهر واعي
          </span>
          <span class="mt-3 font-heading text-2xl font-extrabold">تشخيص أولي مجاني</span>
          <span class="font-body mt-3 text-base leading-7 text-gray-200">
            لديك مشكلة في شركتك وتحتاج إلى فهم طبيعتها؟
          </span>
          <span class="font-body mt-6 inline-flex items-center gap-2 text-base font-bold text-secondary">
            تشخيص أولي مجاني
            <span aria-hidden="true">←</span>
          </span>
        </button>

        <button
          type="button"
          (click)="showForm('message')"
          [attr.aria-pressed]="intent() === 'message'"
          class="flex min-h-44 cursor-pointer flex-col items-start rounded-2xl border-2 border-border bg-white p-6 text-start text-primary 
                shadow-sm transition hover:-translate-y-0.5 hover:border-secondary hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 
                focus-visible:outline-primary motion-reduce:transition-none motion-reduce:hover:translate-y-0 md:p-8 focus:shadow-secondary-light focus:shadow-lg"
          [class.border-primary]="intent() === 'message'"
          [class.shadow-md]="intent() === 'message'"
        >
          <span class="font-body inline-flex items-center gap-3 text-lg font-bold text-secondary">
            <svg class="size-10 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            تواصل مباشر
          </span>
          <span class="mt-3 font-heading text-2xl font-extrabold">تواصل معنا</span>
          <span class="font-body mt-3 text-base leading-7 text-gray-700">
            لديك استفسار أو ترغب في طلب إحدى خدماتنا؟
          </span>
          <span class="font-body mt-6 inline-flex items-center gap-2 text-base font-bold text-primary">
            أرسل رسالتك
            <span aria-hidden="true">←</span>
          </span>
        </button>
      </div>
    </div>

    <div id="contact-form" class="scroll-mt-6 mt-7  lg:mx-auto lg:mt-16 lg:max-w-4xl">
      @switch (intent()) {
        @case ('message') {
          <app-contact-form />
        }
        @case ('diagnosis') {
          <app-free-diagnosis />
        }
      }
    </div>
  </div>
</section>
