<section class="relative overflow-hidden bg-primary">
  <img
    src="/images/sectionsBackground/services.webp"
    alt=""
    width="1600"
    height="900"
    class="pointer-events-none absolute inset-0 size-full object-cover"
    aria-hidden="true"
  />
  <div class="pointer-events-none absolute inset-0 bg-primary/80" aria-hidden="true"></div>
  <div class="relative mx-auto max-w-6xl px-4 py-16 md:py-20">
    <p class="font-body text-sm font-medium text-secondary">مختبر الشركات</p>
    <h1 class="font-heading mt-3 text-4xl font-extrabold text-inverse md:text-5xl">خدماتنا</h1>
    <div class="mt-5 h-1 w-16 bg-secondary" aria-hidden="true"></div>
  </div>
</section>

<section class="bg-surface">
  <div class="mx-auto max-w-6xl px-4 py-16 md:py-20">
    <h2 class="font-heading text-3xl font-extrabold text-primary">خدماتنا</h2>
    <div class="mt-3 h-1 w-12 bg-secondary" aria-hidden="true"></div>

    <ul class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (service of services; track service.title; let i = $index) {
        <li class="service-card h-full" data-service-card [style.--delay]="i * 80 + 'ms'">
          <div
            class="service-card-inner cursor-pointer overflow-hidden rounded-md bg-background-soft shadow-sm"
          >
            <div class="service-card-accent h-1 bg-secondary" aria-hidden="true"></div>
            <div class="flex h-full flex-col px-5 py-6">
              <h3 class="font-heading text-xl font-extrabold text-primary">{{ service.title }}</h3>
              <ul class="font-body mt-4 flex flex-col gap-2 text-lg leading-8 text-gray-700">
                @for (item of service.capabilities; track item) {
                  <li class="service-capability ps-4">{{ item }}</li>
                }
              </ul>
              <a
                routerLink="/contact"
                class="font-body mt-auto inline-flex min-h-11 items-center pt-6 text-sm font-medium text-primary hover:text-tertiary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
              >
                تواصل معنا
              </a>
            </div>
          </div>
        </li>
      }
    </ul>
  </div>
</section>

<section class="bg-primary">
  <div class="mx-auto max-w-6xl px-4 py-16 md:py-20">
    <h2 class="font-heading text-3xl font-extrabold text-inverse">
      نحن لا نقدم تقارير... نحن نبني قرارات.
    </h2>
    <div class="mt-5 h-1 w-16 bg-secondary" aria-hidden="true"></div>
    <a
      routerLink="/contact"
      class="font-body mt-8 inline-flex min-h-11 items-center rounded-md bg-secondary px-5 text-sm font-medium text-primary hover:bg-secondary-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
    >
      تواصل معنا
    </a>
  </div>
</section>
