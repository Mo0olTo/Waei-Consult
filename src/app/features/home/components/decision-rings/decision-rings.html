<svg viewBox="0 0 400 400" class="rings block h-full w-full" focusable="false" aria-hidden="true">
  <g class="stroke-tertiary/10">
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="40" y1="200" x2="360" y2="200" />
  </g>

  <g class="rings__cw">
    <circle cx="200" cy="200" r="180" class="fill-none stroke-tertiary/20" stroke-width="1" />
    @for (angle of ticks; track angle) {
      <line
        x1="200"
        y1="20"
        x2="200"
        y2="28"
        class="stroke-tertiary/35"
        stroke-width="1"
        [attr.transform]="'rotate(' + angle + ' 200 200)'"
      />
    }
    <circle cx="200" cy="20" r="3" class="fill-secondary" />
  </g>

  <g class="rings__ccw">
    <circle
      cx="200"
      cy="200"
      r="140"
      class="fill-none stroke-tertiary/30"
      stroke-width="1.25"
      stroke-dasharray="2 6"
    />
    <circle
      cx="200"
      cy="200"
      r="140"
      class="fill-none stroke-secondary"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-dasharray="90 790"
    />
    @for (angle of nodes; track angle) {
      <circle
        cx="200"
        cy="60"
        r="2.5"
        class="fill-tertiary/70"
        [attr.transform]="'rotate(' + angle + ' 200 200)'"
      />
    }
  </g>

  <circle cx="200" cy="200" r="96" class="fill-none stroke-tertiary/40" stroke-width="1.5" />
  <circle cx="200" cy="200" r="52" class="fill-none stroke-secondary/60" stroke-width="1.5" />

  <circle cx="200" cy="200" r="10" class="rings__pulse fill-secondary/30" />
  <circle cx="200" cy="200" r="5" class="fill-secondary" />
</svg>
