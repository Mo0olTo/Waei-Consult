<section
  class="carousel-home relative isolate bg-primary-dark"
  aria-label="لمحات من خدمات واعي"
  (focusin)="pauseAutoplay()"
  (focusout)="resumeAutoplay($event)"
>
  <div
    class="pointer-events-none absolute inset-0 z-10 shadow-[inset_0_0_80px_var(--color-primary-dark)]"
    aria-hidden="true"
  ></div>

  <owl-carousel-o
    [options]="options"
    (initialized)="localizeControls()"
    (translated)="localizeControls()"
  >
    @for (slide of slides; track slide.id; let first = $first) {
      <ng-template carouselSlide [id]="'carousel-home-' + slide.id">
        <figure class="carousel-home-slide">
          <img
          class="carousel-home-slide__image"
          [src]="slide.src"
          [alt]="slide.alt"
          width="1536"
          height="1024"
          [attr.loading]="first ? 'eager' : 'lazy'"
          [attr.fetchpriority]="first ? 'high' : null"
          decoding="async"
          dir="rtl"
        />
          <div class="absolute inset-0 bg-black/50" aria-hidden="true"></div>
          <div
            class="absolute inset-0 bg-linear-to-b from-primary-dark/80 via-primary-dark/20 to-transparent md:bg-linear-to-bl md:from-primary-dark/70 md:via-transparent"
            aria-hidden="true"
          ></div>
          <figcaption
            class="absolute inset-x-0 top-4 bottom-16 flex items-center px-4 text-center text-white md:inset-x-auto md:start-0 md:top-0 md:bottom-auto md:block md:max-w-2xl md:p-12 md:text-start"
          >
            <div class="mx-auto w-full max-w-md text-center md:mx-0 md:max-w-none md:border-s-2 md:border-secondary md:ps-5 md:text-start">
              <p class="font-heading text-xl font-bold md:text-4xl">
                {{ slide.title }}
              </p>
              <p class="font-body mt-1 text-sm leading-6 md:mt-3 md:text-2xl md:leading-8">
                {{ slide.description }}
              </p>
              @if (slide.id === 1) {
                <a
                  routerLink="/contact"
                  [queryParams]="{ form: 'diagnosis' }"
                  class="font-body mt-3 inline-flex min-h-11 items-center rounded-md bg-secondary px-5 text-sm font-bold text-primary hover:bg-secondary-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white md:mt-6"
                >
                  تشخيص أولي مجاني
                </a>
              }
            </div>
          </figcaption>
        </figure>
      </ng-template>
    }
  </owl-carousel-o>
</section>
