<section
  class="carousel-home relative bg-primary-dark"
  aria-label="لمحات من خدمات واعي"
  (focusin)="pauseAutoplay()"
  (focusout)="resumeAutoplay($event)"
>
  <owl-carousel-o
    [options]="options"
    (initialized)="localizeControls()"
    (translated)="localizeControls()"
  >
    @for (slide of slides; track slide.id; let first = $first) {
      <ng-template carouselSlide [id]="'carousel-home-' + slide.id">
        <figure class="carousel-home-slide">
          <img
          class="carousel-home-slide__image"
          [src]="slide.src"
          [alt]="slide.alt"
          width="1536"
          height="1024"
          [attr.loading]="first ? 'eager' : 'lazy'"
          [attr.fetchpriority]="first ? 'high' : null"
          decoding="async"
        />
          <div class="absolute inset-0 bg-black/45" aria-hidden="true"></div>
          <div
            class="absolute inset-0 bg-linear-to-b from-black/70 via-black/20 to-transparent md:bg-linear-to-bl md:from-black/60 md:via-transparent"
            aria-hidden="true"
          ></div>
          <figcaption
            class="absolute inset-x-0 top-1/4 -translate-y-1/2 px-4 text-center text-white md:inset-x-auto md:start-0 md:top-0 md:max-w-xl md:translate-y-0 md:p-12 md:text-start"
          >
            <div class="mx-auto max-w-md text-center md:mx-0 md:max-w-none md:border-s-2 md:border-secondary md:ps-5 md:text-start">
              <p class="font-heading text-xl leading-snug font-bold md:text-4xl">
                {{ slide.title }}
              </p>
              <p class="font-body mt-1 text-sm leading-6 md:mt-3 md:text-lg md:leading-8">
                {{ slide.description }}
              </p>
            </div>
          </figcaption>
        </figure>
      </ng-template>
    }
  </owl-carousel-o>
</section>
