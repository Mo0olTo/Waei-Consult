<footer class="border-t border-border bg-background-soft">
  <div class="site-container grid gap-8 px-4 py-12 md:grid-cols-2">
    <a
      routerLink="/"
      class="inline-flex max-w-full justify-start md:justify-start focus-visible:outline-2 
       focus-visible:outline-offset-2 focus-visible:outline-secondary"
    >
      <img
        src="/images/Footer/Footer-waei-.png"
        alt="واعي، مختبر الشركات"
        width="745"
        height="1024"
        decoding="async"
        loading="lazy"
        class="h-auto w-40 max-w-full object-cover  "
      />
    </a>
    

    <nav aria-label="روابط التذييل">
      <ul class="grid gap-2 sm:grid-cols-2">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              class="font-body inline-flex min-h-11 items-center text-sm text-gray-700 hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <div class="border-t border-border">
    <p class="site-container text-center font-body py-4 text-sm sm:text-lg text-muted font-bold">
        جميع الحقوق محفوظة © {{ currentYear }} واعــــي للإستشــارات
    </p>
  </div>
</footer>
