<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:start-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-surface focus:px-3 focus:py-2 focus:text-sm focus:font-medium focus:text-primary focus:outline-2 focus:outline-offset-2 focus:outline-secondary"
>
  تخطي إلى المحتوى الرئيسي
</a>


<header
  class="relative isolate overflow-hidden 
    bg-[linear-gradient(to_bottom,var(--color-primary)_0%,var(--color-primary)_95%,white_100%)] 
    md:bg-[linear-gradient(to_bottom,var(--color-primary)_0%,var(--color-primary)_90%,white_100%)]
    transition-[border-radius,box-shadow] duration-300"
  [class.rounded-b-2xl]="isScrolled()"
  [class.shadow-md]="isScrolled()"
>
  <!-- Subtle geometric pattern -->
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 -z-10 opacity-20
      [background-image:radial-gradient(rgba(255,255,255,0.65)_1px,transparent_1px)]
      [background-size:24px_24px]
      [mask-image:linear-gradient(to_bottom,black_0%,black_35%,transparent_85%)]"
  ></div>

  <div
    class="site-container flex items-center justify-between gap-4 px-3 transition-[padding] duration-300 md:px-0 "
    [class.py-4]="!isScrolled()"
    [class.py-2]="isScrolled()"
  >
    <a
      routerLink="/"
      class="inline-flex shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
    >
      <span
        class="inline-flex shrink-0 items-center justify-center overflow-hidden rounded-full bg-white  transition-[width,height] duration-300 motion-reduce:transition-none"
        [class.size-11]="!isScrolled()"
        [class.md:size-16]="!isScrolled()"
        [class.size-9]="isScrolled()"
        [class.md:size-13]="isScrolled()"
      >
        <img
          src="/images/logo/logo_circle2.webp"
          alt="واعي"
          width="1254"
          height="1254"
          decoding="async"
          class="size-full object-contain object-center"
        />
      </span>

      <p
        class="mr-5 flex flex-col items-center justify-center text-[13px] font-bold text-[var(--color-secondary-light)] md:text-[19px]"
      >
        إستشارات | حوكمة | دعم إتخاذ القرار
      </p>
    </a>

    <nav
      aria-label="التنقل الرئيسي"
      class="hidden items-center gap-6 md:flex"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="!text-secondary-light"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="font-body text-lg font-bold text-white transition-colors hover:text-secondary-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-md border border-border 
      text-primary md:hidden focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-navigation"
      [attr.aria-label]="isMenuOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6 6 18"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      }
    </button>
  </div>

  <nav
    id="mobile-navigation"
    aria-label="التنقل في الجوال"
    class="mobile-nav"
    [class.is-open]="isMenuOpen()"
    [attr.inert]="isMenuOpen() ? null : ''"
  >
    <div class="mobile-nav__inner">
      <ul class="flex flex-col gap-1 border-t border-border px-4 py-3">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="!text-secondary-light hover:text-secondary-dark "
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              class="font-body block min-h-11 rounded-md px-3 py-3 text-base font-bold text-white
                     hover:text-secondary-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
