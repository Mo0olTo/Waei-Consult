<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:start-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-surface focus:px-3 focus:py-2 focus:text-sm focus:font-medium focus:text-primary focus:outline-2 focus:outline-offset-2 focus:outline-secondary"
>
  تخطي إلى المحتوى الرئيسي
</a>

<header class="border-b border-border bg-surface">
  <div class="site-container flex items-center justify-between gap-4 py-4">
    <a
      routerLink="/"
      class="font-heading text-3xl font-bold tracking-tight text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
    >
      واعي
    </a>

    <nav aria-label="التنقل الرئيسي" class="hidden items-center gap-6 md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-primary"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="font-body text-sm font-bold text-muted transition-colors hover:text-primary 
          focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-md border border-border text-primary md:hidden focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-navigation"
      [attr.aria-label]="isMenuOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
      (click)="toggleMenu()"
    >
      @if (isMenuOpen()) {
        <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6 6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      }
    </button>
  </div>

  @if (isMenuOpen()) {
    <nav
      id="mobile-navigation"
      aria-label="التنقل في الجوال"
      class="border-t border-border px-4 py-3 md:hidden"
    >
      <ul class="flex flex-col gap-1">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="text-primary bg-gray-50"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              class="font-body block min-h-11 rounded-md px-3 py-3 text-base font-bold text-gray-700 hover:bg-gray-50 hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
