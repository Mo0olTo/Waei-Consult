<article
  class="testimonial-card flex h-full w-full flex-col items-center rounded-2xl bg-surface px-6 py-8 text-center ring-1 ring-border"
>
  @if (photoSrc()) {
    <img
      class="size-20 rounded-full object-cover ring-2 ring-secondary"
      [src]="photoSrc()"
      [alt]="photoAlt()"
      width="80"
      height="80"
      loading="lazy"
      decoding="async"
    />
  } @else {
    <span
      class="grid size-20 place-items-center overflow-hidden rounded-full bg-primary ring-2 ring-secondary"
      aria-hidden="true"
    >
      <svg class="size-10 text-secondary" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.2-8 5v1.5h16V19c0-2.8-3.6-5-8-5Z"
        />
      </svg>
    </span>
  }

  <h3 class="font-heading mt-4 text-lg font-extrabold text-primary">{{ name() }}</h3>

  <blockquote class="font-body mt-3 flex-1 text-base leading-8 text-gray-700">
    <p>{{ review() }}</p>
  </blockquote>

  <div class="testimonial-card__line mt-6 bg-secondary" aria-hidden="true"></div>
</article>
