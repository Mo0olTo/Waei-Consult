@if (present()) {
  <div
    class="loading-screen"
    [class.is-leaving]="leaving()"
    [style.--loading-fade]="fadeDuration"
    role="status"
    aria-live="polite"
    aria-label="جارٍ تحميل الصفحة"
  >
    <img src="/images/logo/waei_logo-2.webp" alt="" width="1200" height="1200" />
    <span class="loading-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </div>
}
