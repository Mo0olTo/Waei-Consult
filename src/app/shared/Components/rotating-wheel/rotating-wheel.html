<svg class="wheel" viewBox="0 0 800 800" role="group" [attr.aria-label]="label()">
  <g class="wheel__rotor">
    @for (sector of sectors(); track sector.id; let i = $index) {
      <g
        class="wheel__sector"
        [class.is-active]="activeIndex() === i"
        tabindex="0"
        role="button"
        [attr.aria-pressed]="activeIndex() === i"
        [attr.aria-label]="sector.ariaLabel"
        (mouseenter)="activate(i)"
        (click)="activate(i)"
        (focus)="activate(i)"
        (keydown.enter)="activateWithKey($event, i)"
        (keydown.space)="activateWithKey($event, i)"
      >
        <path class="wheel__shape" [attr.d]="sector.path" />
        <text class="wheel__label" [attr.x]="sector.labelX" [attr.y]="sector.labelY" aria-hidden="true">
          <tspan [attr.x]="sector.labelX" dy="-0.35em">{{ sector.lines[0] }}</tspan>
          <tspan [attr.x]="sector.labelX" dy="1.3em">{{ sector.lines[1] }}</tspan>
        </text>
      </g>
    }
    <circle
      class="wheel__hub"
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="hubRadius"
      aria-hidden="true"
    />
  </g>
</svg>
